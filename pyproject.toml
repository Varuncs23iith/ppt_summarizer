[tool.poetry]
name = "ppt-analyzer"
version = "0.1.0"
description = "lets you create summary and analyse powerpoint presentation"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
openai = "^2.29.0"
pydantic = "^2.12.5"
pathlib = "^1.0.1"
python-box = "^7.4.1"
pillow = "^12.1.1"
fitz = "^0.0.1.dev2"
python-pptx = "^1.0.2"
pymupdf = "^1.27.2.2"
pdf2image = "^1.17.0"
pyyaml = "^6.0.3"
jinja2 = "^3.1.6"
sqlalchemy = "^2.0.48"
psycopg2-binary = "^2.9.11"
asyncpg = "^0.31.0"
httpx = "^0.28.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
