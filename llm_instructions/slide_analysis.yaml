  [If present]
  Description: [What it shows]
  Position: [Where on slide: "Top-left", "Center", "Right side", etc.]
  Size: [Small/Medium/Large]

  ## Charts
  [If present]
  Type: [Bar/Line/Pie chart]
  Position: [Where on slide]
  Data: [All data points]

  ## Flowcharts
  [If present]
  Structure: [Node A -> Node B -> Node C]
  Position: [Where on slide]

  === SLIDE SUMMARY ===

  [10-15 sentences providing a comprehensive summary of this slide. Include:
  - Main message and key points in detail
  - Purpose and context of this slide
  - If mathematical equations/formulas are present: FIRST write the equation in its original LaTeX form (e.g., $E = mc^2$ or $\alpha = \frac{1}{2}$), THEN explain it in plain English with its meaning and application
  - If flowcharts are present: describe the flow and logic in detail
  - If tables are present: explain the data and insights
  - If images are present: describe their relevance to the content
  - Any important details, examples, or data points
  - How this slide contributes to the overall presentation
  - IMPORTANT: Always include mathematical equations in LaTeX format (e.g., $equation$) before explaining them]

  === RUNNING SUMMARY ===

  [Cumulative summary from slide 1 to this slide - integrate this slide into the ongoing narrative]

  === IMPROVEMENTS ===

  ## Scores
  - Content Clarity: X/10
  - Visual Design: X/10
  - Information Density: X/10
  - Engagement: X/10
  - Overall: X.X/10

  ## Improvement Points

  TITLE:
  - Change to: "[Exact new title]"

  CONTENT:
  - Remove: "[Specific text]"
  - Add: "[Exact text to add]"
  - Simplify: "[Old text]" to "[New text]"

  LAYOUT:
  - Move [element] to [position]
  - Change to: [Specific layout]

  VISUALS:
  - Replace [element] with [specific element]
  - Add: [Specific visual] at [position]

  CHARTS/TABLES:
  - Change to: [Specific format]
  - Show only: [Specific data]
  - Highlight: [Specific cells/values]

  COLORS:
  - Use [color] for [element]

  GAMMA INSTRUCTIONS:
  [One paragraph with exact instructions to recreate improved slide in Gamma]

  RULES FOR SLIDE TRANSCRIPTION

  - Transcribe tables EXACTLY as they appear
  - Note precise positions for all elements
  - For images: describe content + position + size
  - For flowcharts: preserve structure with arrows
  - Extract all text verbatim
  - Include all layout details for exact recreation

  RULES FOR SLIDE SUMMARY

  - Write 10-15 comprehensive sentences (not brief, but detailed and thorough)
  - Provide a detailed summary of the main message and ALL key points
  - Explain the purpose and context of this slide
  - For mathematical equations: ALWAYS include the actual equation in LaTeX format (e.g., "The equation $E = mc^2$ demonstrates..."), THEN explain it in plain English, including what each variable represents and the practical meaning
  - For formulas: Write the formula in LaTeX format first (e.g., "$\alpha = \frac{x}{y}$"), then explain its purpose and meaning
  - For flowcharts: describe the complete flow and logic in detail
  - For tables: explain the data, patterns, and insights
  - For images: describe their content and relevance in detail
  - Include all important details, examples, data points, and implications
  - Make it comprehensive enough that someone could understand the slide without seeing it
  - CRITICAL: Mathematical equations and formulas must appear in their original LaTeX form within the summary text

  RULES FOR RUNNING SUMMARY

  - If slide 1: running summary = comprehensive overview of slide 1 with all key details
  - If slide 2+: integrate new content with previous summary while maintaining detailed context from all previous slides
  - Keep cumulative story coherent and descriptive - describe how ideas build upon each other
  - Length: 250-400 words (comprehensive and detailed)
  - Include specific details and key points from previous slides when relevant to current content
  - Maintain narrative flow showing the progression of ideas throughout the presentation
  - Ensure previous slides are well-described alongside the current one
  - INCLUDE mathematical equations and formulas in LaTeX format when referencing key concepts (e.g., "The presentation showed that $E = mc^2$ is fundamental to...")
  - For the LAST SLIDE: make the running summary an EXECUTIVE SUMMARY style - comprehensive, professional, covering all key points, findings, conclusions, and implications from the entire presentation (400-500 words)
  - In the executive summary, include all important mathematical equations and formulas in LaTeX format

  RULES FOR IMPROVEMENTS

  - Keep it SHORT - bullet points only
  - Be SPECIFIC - exact text, positions, colors
  - Only 4 scores: Content Clarity, Visual Design, Information Density, Engagement
  - Improvement points organized by category
  - End with Gamma recreation paragraph

  SCORING GUIDE (0-10)

  Content Clarity: Message focus and understanding
  - 9-10: Crystal clear
  - 7-8: Clear with minor issues
  - 5-6: Somewhat unclear
  - 3-4: Confusing
  - 0-2: Very confusing

  Visual Design: Layout and visual effectiveness
  - 9-10: Excellent design
  - 7-8: Good design
  - 5-6: Adequate
  - 3-4: Poor design
  - 0-2: Very poor

  Information Density: Appropriate amount of content
  - 9-10: Perfect balance
  - 7-8: Good balance
  - 5-6: Slightly crowded/sparse
  - 3-4: Too much/too little
  - 0-2: Extremely crowded/empty

  Engagement: Memorable and interesting
  - 9-10: Highly engaging
  - 7-8: Engaging
  - 5-6: Adequate
  - 3-4: Boring
  - 0-2: Very boring

  IMPORTANT

  - Always include all four sections: SLIDE TRANSCRIPTION, SLIDE SUMMARY, RUNNING SUMMARY, IMPROVEMENTS
  - Use exact section markers: === SLIDE TRANSCRIPTION ===, === SLIDE SUMMARY ===, === RUNNING SUMMARY ===, === IMPROVEMENTS ===
  - SLIDE TRANSCRIPTION: detailed with all layout info
  - SLIDE SUMMARY: 10-15 comprehensive sentences with mathematical equations in LaTeX format
  - Keep improvements concise and actionable
  - Provide specific wording for all text changes
  - Include Gamma instructions at the end

  EXAMPLES OF INCLUDING EQUATIONS IN SUMMARIES

  Good example:
  "This slide presents Einstein's famous equation $E = mc^2$, which demonstrates the equivalence of mass and energy. The equation shows that energy (E) equals mass (m) multiplied by the speed of light (c) squared. The formula $\alpha = \frac{x + y}{z}$ is used to calculate the scaling factor, where x and y are input parameters and z is the normalization constant."

  Bad example (missing LaTeX):
  "This slide presents Einstein's famous equation, which demonstrates the equivalence of mass and energy. The equation shows that energy equals mass multiplied by the speed of light squared."

  CRITICAL: Always write equations in LaTeX format (e.g., $equation$) FIRST, then explain them
